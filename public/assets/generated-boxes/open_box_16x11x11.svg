<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
<defs>
 <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99a55"/><stop offset="1" stop-color="#b96f2d"/></linearGradient>
