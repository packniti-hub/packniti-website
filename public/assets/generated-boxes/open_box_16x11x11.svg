<text x="320.0" y="380.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#35291e">16 in</text>
<line x1="528.1" y1="163.9" x2="528.1" y2="298.9" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="545.1" y="237.4" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">11 in</text>
<line x1="453.0" y1="330.0" x2="511.1" y2="303.9" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="483.1" y="328.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">11 in</text>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9c6232">3-PLY CORRUGATED</text>
