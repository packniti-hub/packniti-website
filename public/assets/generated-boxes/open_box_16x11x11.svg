<!-- open flaps -->
<polygon points="243.1,163.9 493.1,163.9 493.1,64.8 243.1,64.8" fill="url(#top)" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="195.0,190.0 445.0,190.0 445.0,118.7 195.0,118.7" fill="#d08b48" stroke="#8f5b2c" stroke-width="2"/>
