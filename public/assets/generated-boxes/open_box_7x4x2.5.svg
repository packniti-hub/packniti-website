<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
<defs>
 <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99a55"/><stop offset="1" stop-color="#b96f2d"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5ae6d"/><stop offset="1" stop-color="#c9813c"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
 <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#51402f"/></marker>
</defs>
<rect width="640" height="420" rx="28" fill="#eee7dc"/>
<ellipse cx="320" cy="345" rx="180" ry="20" fill="#6c4b2e" opacity=".18" filter="url(#shadow)"/>
<!-- open flaps -->
<polygon points="235.0,168.3 485.0,168.3 485.0,80.8 235.0,80.8" fill="url(#top)" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="195.0,190.0 445.0,190.0 445.0,127.0 195.0,127.0" fill="#d08b48" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="445.0,190.0 485.0,168.3 467.0,120.2 427.0,141.9" fill="#bd7635" stroke="#8f5b2c" stroke-width="2"/>
<!-- inside cavity -->
<polygon points="207.0,200.0 433.0,200.0 473.0,178.3 247.0,178.3" fill="#8e5729" opacity=".95"/>
<polygon points="195.0,190.0 445.0,190.0 485.0,168.3 235.0,168.3" fill="#c37b39" stroke="#8f5b2c" stroke-width="2"/>
<!-- box body -->
<polygon points="195.0,190.0 445.0,190.0 445.0,289.3 195.0,289.3" fill="url(#kraft)" stroke="#87552a" stroke-width="2"/>
<polygon points="445.0,190.0 485.0,168.3 485.0,267.6 445.0,289.3" fill="#a9632b" stroke="#87552a" stroke-width="2"/>
<!-- subtle corrugation -->
<path d="M213.0 214.8 L427.0 214.8 M213.0 244.6 L427.0 244.6" stroke="#e9b978" opacity=".45" stroke-width="2"/>
<!-- dimension lines -->
<line x1="195.0" y1="319.3" x2="445.0" y2="319.3" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="320.0" y="344.3" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#35291e">7 in</text>
<line x1="520.0" y1="168.3" x2="520.0" y2="267.6" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="537.0" y="223.9" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">2.5 in</text>
<line x1="453.0" y1="294.3" x2="503.0" y2="272.6" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="479.0" y="297.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">4 in</text>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9c6232">3-PLY CORRUGATED</text>
</svg>