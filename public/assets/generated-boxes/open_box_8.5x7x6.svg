<polygon points="210.6,200.0 429.4,200.0 487.1,168.7 268.2,168.7" fill="#8e5729" opacity=".95"/>
<polygon points="198.6,190.0 441.4,190.0 499.1,158.7 256.2,158.7" fill="#c37b39" stroke="#8f5b2c" stroke-width="2"/>
<!-- box body -->
<polygon points="198.6,190.0 441.4,190.0 441.4,325.0 198.6,325.0" fill="url(#kraft)" stroke="#87552a" stroke-width="2"/>
<polygon points="441.4,190.0 499.1,158.7 499.1,293.7 441.4,325.0" fill="#a9632b" stroke="#87552a" stroke-width="2"/>
<!-- subtle corrugation -->
<path d="M216.6 223.8 L423.4 223.8 M216.6 264.2 L423.4 264.2" stroke="#e9b978" opacity=".45" stroke-width="2"/>
<!-- dimension lines -->
<line x1="198.6" y1="355.0" x2="441.4" y2="355.0" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="320.0" y="380.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#35291e">8.5 in</text>
<line x1="534.1" y1="158.7" x2="534.1" y2="293.7" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="551.1" y="232.2" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">6 in</text>
<line x1="449.4" y1="330.0" x2="517.1" y2="298.7" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="484.3" y="323.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">7 in</text>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9c6232">3-PLY CORRUGATED</text>
</svg>