<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
<defs>
 <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99a55"/><stop offset="1" stop-color="#b96f2d"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5ae6d"/><stop offset="1" stop-color="#c9813c"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
 <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#51402f"/></marker>
</defs>
<rect width="640" height="420" rx="28" fill="#eee7dc"/>
<ellipse cx="320" cy="345" rx="173" ry="20" fill="#6c4b2e" opacity=".18" filter="url(#shadow)"/>
<!-- open flaps -->
<polygon points="258.3,158.3 498.3,158.3 498.3,74.6 258.3,74.6" fill="url(#top)" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="200.0,190.0 440.0,190.0 440.0,129.7 200.0,129.7" fill="#d08b48" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="440.0,190.0 498.3,158.3 480.3,112.3 422.0,143.9" fill="#bd7635" stroke="#8f5b2c" stroke-width="2"/>
<!-- inside cavity -->
<polygon points="212.0,200.0 428.0,200.0 486.3,168.3 270.3,168.3" fill="#8e5729" opacity=".95"/>
<polygon points="200.0,190.0 440.0,190.0 498.3,158.3 258.3,158.3" fill="#c37b39" stroke="#8f5b2c" stroke-width="2"/>
<!-- box body -->
<polygon points="200.0,190.0 440.0,190.0 440.0,285.0 200.0,285.0" fill="url(#kraft)" stroke="#87552a" stroke-width="2"/>
<polygon points="440.0,190.0 498.3,158.3 498.3,253.3 440.0,285.0" fill="#a9632b" stroke="#87552a" stroke-width="2"/>
<!-- subtle corrugation -->
<path d="M218.0 213.8 L422.0 213.8 M218.0 242.2 L422.0 242.2" stroke="#e9b978" opacity=".45" stroke-width="2"/>
<!-- dimension lines -->
<line x1="200.0" y1="315.0" x2="440.0" y2="315.0" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="320.0" y="340.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#35291e">6 in</text>
<line x1="533.3" y1="158.3" x2="533.3" y2="253.3" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="550.3" y="211.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">1.5 in</text>
<line x1="448.0" y1="290.0" x2="516.3" y2="258.3" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="483.2" y="283.3" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">5 in</text>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9c6232">3-PLY CORRUGATED</text>
</svg>