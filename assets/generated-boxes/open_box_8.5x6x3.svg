<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
<defs>
 <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99a55"/><stop offset="1" stop-color="#b96f2d"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5ae6d"/><stop offset="1" stop-color="#c9813c"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
 <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#51402f"/></marker>
</defs>
<rect width="640" height="420" rx="28" fill="#eee7dc"/>
<ellipse cx="320" cy="345" rx="180" ry="20" fill="#6c4b2e" opacity=".18" filter="url(#shadow)"/>
<!-- open flaps -->
<polygon points="244.4,163.2 494.4,163.2 494.4,75.8 244.4,75.8" fill="url(#top)" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="195.0,190.0 445.0,190.0 445.0,127.1 195.0,127.1" fill="#d08b48" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="445.0,190.0 494.4,163.2 476.4,115.1 427.0,142.0" fill="#bd7635" stroke="#8f5b2c" stroke-width="2"/>
<!-- inside cavity -->
<polygon points="207.0,200.0 433.0,200.0 482.4,173.2 256.4,173.2" fill="#8e5729" opacity=".95"/>
<polygon points="195.0,190.0 445.0,190.0 494.4,163.2 244.4,163.2" fill="#c37b39" stroke="#8f5b2c" stroke-width="2"/>
<!-- box body -->
<polygon points="195.0,190.0 445.0,190.0 445.0,285.0 195.0,285.0" fill="url(#kraft)" stroke="#87552a" stroke-width="2"/>
<polygon points="445.0,190.0 494.4,163.2 494.4,258.2 445.0,285.0" fill="#a9632b" stroke="#87552a" stroke-width="2"/>
<!-- subtle corrugation -->
<path d="M213.0 213.8 L427.0 213.8 M213.0 242.2 L427.0 242.2" stroke="#e9b978" opacity=".45" stroke-width="2"/>
<!-- dimension lines -->
<line x1="195.0" y1="315.0" x2="445.0" y2="315.0" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="320.0" y="340.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#35291e">8.5 in</text>
<line x1="529.4" y1="163.2" x2="529.4" y2="258.2" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="546.4" y="216.7" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">3 in</text>
<line x1="453.0" y1="290.0" x2="512.4" y2="263.2" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="483.7" y="288.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">6 in</text>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9c6232">3-PLY CORRUGATED</text>
</svg>