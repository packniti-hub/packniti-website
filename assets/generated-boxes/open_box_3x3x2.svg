<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
<defs>
 <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99a55"/><stop offset="1" stop-color="#b96f2d"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5ae6d"/><stop offset="1" stop-color="#c9813c"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
 <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#51402f"/></marker>
</defs>
<rect width="640" height="420" rx="28" fill="#eee7dc"/>
<ellipse cx="320" cy="345" rx="144" ry="20" fill="#6c4b2e" opacity=".18" filter="url(#shadow)"/>
<!-- open flaps -->
<polygon points="290.0,152.0 490.0,152.0 490.0,53.7 290.0,53.7" fill="url(#top)" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="220.0,190.0 420.0,190.0 420.0,119.2 220.0,119.2" fill="#d08b48" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="420.0,190.0 490.0,152.0 472.0,97.9 402.0,135.9" fill="#bd7635" stroke="#8f5b2c" stroke-width="2"/>
<!-- inside cavity -->
<polygon points="232.0,200.0 408.0,200.0 478.0,162.0 302.0,162.0" fill="#8e5729" opacity=".95"/>
<polygon points="220.0,190.0 420.0,190.0 490.0,152.0 290.0,152.0" fill="#c37b39" stroke="#8f5b2c" stroke-width="2"/>
<!-- box body -->
<polygon points="220.0,190.0 420.0,190.0 420.0,295.9 220.0,295.9" fill="url(#kraft)" stroke="#87552a" stroke-width="2"/>
<polygon points="420.0,190.0 490.0,152.0 490.0,257.9 420.0,295.9" fill="#a9632b" stroke="#87552a" stroke-width="2"/>
<!-- subtle corrugation -->
<path d="M238.0 216.5 L402.0 216.5 M238.0 248.2 L402.0 248.2" stroke="#e9b978" opacity=".45" stroke-width="2"/>
<!-- dimension lines -->
<line x1="220.0" y1="325.9" x2="420.0" y2="325.9" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="320.0" y="350.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#35291e">3 in</text>
<line x1="525.0" y1="152.0" x2="525.0" y2="257.9" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="542.0" y="210.9" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">2 in</text>
<line x1="428.0" y1="300.9" x2="508.0" y2="262.9" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="469.0" y="287.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">3 in</text>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9c6232">3-PLY CORRUGATED</text>
</svg>