<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
<defs>
 <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99a55"/><stop offset="1" stop-color="#b96f2d"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5ae6d"/><stop offset="1" stop-color="#c9813c"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
 <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#51402f"/></marker>
</defs>
<rect width="640" height="420" rx="28" fill="#eee7dc"/>
<ellipse cx="320" cy="345" rx="180" ry="20" fill="#6c4b2e" opacity=".18" filter="url(#shadow)"/>
<!-- open flaps -->
<polygon points="227.9,172.1 477.9,172.1 477.9,78.6 227.9,78.6" fill="url(#top)" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="195.0,190.0 445.0,190.0 445.0,122.7 195.0,122.7" fill="#d08b48" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="445.0,190.0 477.9,172.1 459.9,120.7 427.0,138.6" fill="#bd7635" stroke="#8f5b2c" stroke-width="2"/>
<!-- inside cavity -->
<polygon points="207.0,200.0 433.0,200.0 465.9,182.1 239.9,182.1" fill="#8e5729" opacity=".95"/>
<polygon points="195.0,190.0 445.0,190.0 477.9,172.1 227.9,172.1" fill="#c37b39" stroke="#8f5b2c" stroke-width="2"/>
<!-- box body -->
<polygon points="195.0,190.0 445.0,190.0 445.0,325.0 195.0,325.0" fill="url(#kraft)" stroke="#87552a" stroke-width="2"/>
<polygon points="445.0,190.0 477.9,172.1 477.9,307.1 445.0,325.0" fill="#a9632b" stroke="#87552a" stroke-width="2"/>
<!-- subtle corrugation -->
<path d="M213.0 223.8 L427.0 223.8 M213.0 264.2 L427.0 264.2" stroke="#e9b978" opacity=".45" stroke-width="2"/>
<!-- dimension lines -->
<line x1="195.0" y1="355.0" x2="445.0" y2="355.0" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="320.0" y="380.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#35291e">8.5 in</text>
<line x1="512.9" y1="172.1" x2="512.9" y2="307.1" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="529.9" y="245.6" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">4.5 in</text>
<line x1="453.0" y1="330.0" x2="495.9" y2="312.1" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="475.5" y="337.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">4 in</text>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9c6232">3-PLY CORRUGATED</text>
</svg>