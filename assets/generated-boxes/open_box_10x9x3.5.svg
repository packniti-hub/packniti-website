<line x1="208.9" y1="315.0" x2="431.1" y2="315.0" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="320.0" y="340.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#35291e">10 in</text>
<line x1="529.1" y1="155.8" x2="529.1" y2="250.8" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="546.1" y="209.3" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">3.5 in</text>
<line x1="439.1" y1="290.0" x2="512.1" y2="255.8" stroke="#51402f" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="476.6" y="280.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#35291e">9 in</text>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9c6232">3-PLY CORRUGATED</text>
