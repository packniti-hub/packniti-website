 <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#51402f"/></marker>
</defs>
<rect width="640" height="420" rx="28" fill="#eee7dc"/>
<ellipse cx="320" cy="345" rx="160" ry="20" fill="#6c4b2e" opacity=".18" filter="url(#shadow)"/>
<!-- open flaps -->
<polygon points="271.9,155.8 494.1,155.8 494.1,68.6 271.9,68.6" fill="url(#top)" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="208.9,190.0 431.1,190.0 431.1,127.2 208.9,127.2" fill="#d08b48" stroke="#8f5b2c" stroke-width="2"/>
<polygon points="431.1,190.0 494.1,155.8 476.1,107.8 413.1,142.0" fill="#bd7635" stroke="#8f5b2c" stroke-width="2"/>
