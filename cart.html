<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart — PackNiti</title>
<meta name="description" content="Review your PackNiti boxes before checkout.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cart.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="PackNiti home"><img src="assets/packniti-header-logo.png" alt="PackNiti" class="brand-logo"></a>
  <nav class="navlinks"><a href="boxes.html">Boxes</a><a href="boxes.html#custom">Custom Boxes</a></nav>
  <div class="nav-actions">
    <a class="cart-link active" href="cart.html" aria-label="Open cart" title="Open cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
      <span class="cart-label">Cart</span><b class="cart-count" id="cartCount">0</b>
    </a>
    <a class="contact-link" href="contact.html">Contact Us <span>↗</span></a>
  </div>
</header>

<main>
<section class="cart-hero">
  <div class="eyebrow">PACKNITI · YOUR SELECTION</div>
  <h1>Your <em>cart.</em></h1>
  <p>Review your boxes and quantities before continuing to checkout.</p>
</section>

<section class="cart-wrap">
  <div class="cart-main">
    <div class="section-head"><div><div class="eyebrow">SELECTED BOXES</div><h2 id="itemHeading">Your boxes</h2></div><a href="boxes.html">← Continue shopping</a></div>
    <div id="cartItems" class="cart-items"></div>
  </div>
  <aside class="cart-summary">
    <div class="eyebrow">ORDER SUMMARY</div>
    <div class="summary-line"><span>Boxes</span><strong id="summaryCount">0</strong></div>
    <div class="summary-line"><span>Subtotal</span><strong id="subtotal">₹0</strong></div>
    <div class="shipping-note">Shipping charges applicable.</div>
    <button id="checkoutButton" class="checkout-btn">Continue to checkout <span>→</span></button>
    <button id="clearCart" class="clear-btn">Clear cart</button>
  </aside>
</section>
</main>
<script src="cart.js"></script>
</body>
</html>
